<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hyper-V iSCSI Migration — Interactive Component Diagram</title>
<style>
  body { margin: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }
  #wrap { display: flex; flex-direction: column; }
  canvas { display: block; cursor: pointer; }
  #controls { display: flex; align-items: center; gap: 8px; padding: 8px 24px; border-top: 1px solid #ddd; background: #f0f0f0; user-select: none; }
  #controls button { border: none; background: #555; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  #controls button:hover { background: #333; }
  #controls button.active { background: #E74C3C; }
  #controls button:disabled { background: #bbb; cursor: default; }
  #step-indicator { font-size: 13px; font-weight: 600; color: #333; min-width: 120px; }
  #progress-track { flex: 1; height: 6px; background: #ddd; border-radius: 3px; position: relative; cursor: pointer; }
  #progress-fill { height: 100%; background: #E74C3C; border-radius: 3px; transition: width .25s; }
  #speed-select { font-size: 12px; padding: 2px 4px; border: 1px solid #bbb; border-radius: 4px; }
  #detail { min-height: 60px; padding: 16px 24px; border-top: 1px solid #ddd; background: #fafafa; }
  #detail.empty { color: #999; font-size: 13px; font-style: italic; }
  .d-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; }
  .d-pill { display: inline-block; font-size: 10px; padding: 2px 10px; border-radius: 10px; color: #fff; font-weight: 600; margin-left: 8px; vertical-align: middle; }
  .d-body { font-size: 13px; line-height: 1.6; color: #333; }
  .d-row { margin-top: 6px; }
  .d-label { font-weight: 600; font-size: 12px; }
  .d-val { font-size: 12px; color: #555; }
  code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; background: #eee; padding: 1px 5px; border-radius: 3px; }

</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="controls">
  <button id="btn-rewind" title="Previous step">&#9198;</button>
  <button id="btn-play" title="Play / Pause">&#9654;</button>
  <button id="btn-forward" title="Next step">&#9197;</button>

  <span id="step-indicator">Step — / 8</span>
  <label style="font-size:11px;color:#666">Speed</label>
  <select id="speed-select">
    <option value="0" selected>Manual</option>

    <option value="2500">Normal</option>

<div id="detail" class="empty">Click any numbered step or component box to see details. Press &#9654; to walk through the flow.</div>

<script>
const W = 1000, H = 760;
const c = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
c.width = W * dpr;
c.height = H * dpr;
c.style.width = W + 'px';
c.style.height = H + 'px';
const ctx = c.getContext('2d');
ctx.scale(dpr, dpr);

function drawBox(x,y,w,h,opts={}){
  ctx.save();
  ctx.lineWidth=opts.lineWidth||1.5;
  ctx.strokeStyle=opts.stroke||'#000';
  if(opts.dash) ctx.setLineDash(opts.dash);
  if(opts.fill){ctx.fillStyle=opts.fill;ctx.fillRect(x,y,w,h);}
  ctx.strokeRect(x,y,w,h);
  ctx.restore();
}
function drawText(x,y,text,opts={}){
  ctx.save();
  ctx.fillStyle=opts.color||'#000';
  ctx.font=(opts.bold?'bold ':'')+(opts.italic?'italic ':'')+(opts.size||12)+'px Arial, Helvetica, sans-serif';
  ctx.textAlign=opts.align||'left';
  ctx.fillText(text,x,y);
  ctx.restore();
}
function drawArrow(x1,y1,x2,y2,opts={}){
  ctx.save();
  ctx.lineWidth=opts.lineWidth||1.5;
  ctx.strokeStyle=opts.stroke||'#000';
  if(opts.dash) ctx.setLineDash(opts.dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(!opts.noHead){
    const angle=Math.atan2(y2-y1,x2-x1),hl=opts.headLen||8;
    ctx.fillStyle=opts.stroke||'#000';
    ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hl*Math.cos(angle-0.4),y2-hl*Math.sin(angle-0.4));
    ctx.lineTo(x2-hl*Math.cos(angle+0.4),y2-hl*Math.sin(angle+0.4));
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawPolyArrow(pts,opts={}){
  ctx.save();
  ctx.lineWidth=opts.lineWidth||1.5;
  ctx.strokeStyle=opts.stroke||'#000';
  if(opts.dash) ctx.setLineDash(opts.dash);
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke();
  if(!opts.noHead){
    const last=pts[pts.length-1],prev=pts[pts.length-2];
    const angle=Math.atan2(last[1]-prev[1],last[0]-prev[0]),hl=opts.headLen||8;
    ctx.fillStyle=opts.stroke||'#000';
    ctx.beginPath();ctx.moveTo(last[0],last[1]);
    ctx.lineTo(last[0]-hl*Math.cos(angle-0.4),last[1]-hl*Math.sin(angle-0.4));
    ctx.lineTo(last[0]-hl*Math.cos(angle+0.4),last[1]-hl*Math.sin(angle+0.4));
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawDisk(cx,cy,rx,ry,h,opts={}){
  const fill=opts.fill||'#fff',stroke=opts.stroke||'#000';
  ctx.save();ctx.lineWidth=opts.lineWidth||1.5;ctx.fillStyle=fill;ctx.strokeStyle=stroke;
  ctx.beginPath();ctx.moveTo(cx-rx,cy);ctx.lineTo(cx-rx,cy+h);
  ctx.ellipse(cx,cy+h,rx,ry,0,Math.PI,0,true);ctx.lineTo(cx+rx,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-rx,cy);ctx.lineTo(cx-rx,cy+h);
  ctx.ellipse(cx,cy+h,rx,ry,0,Math.PI,0,true);ctx.lineTo(cx+rx,cy);
  ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI,true);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawStep(x,y,num,color){
  ctx.save();
  ctx.fillStyle=color||'#E74C3C';
  ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(num,x,y+0.5);
  ctx.restore();
}

const hitAreas = [];
function addHit(x,y,w,h,id){ hitAreas.push({x,y,w,h,id}); }
function addCircleHit(cx,cy,r,id){ hitAreas.push({x:cx-r,y:cy-r,w:r*2,h:r*2,id}); }

let selected = null;

const stepSequence = ['step1','step2','step3','step4','step5','iscsiarrow','progress','step6','step7','step8'];
const stepLabels = ['1 — Power Off + iSCSI Setup','2 — iSCSI Target Feature','3 — iSCSI Target Server','4 — Create PVCs + Pod','5 — hyperv-populator Pod','Data Path — iSCSI TCP 3260','Progress Reporting','6 — virt-v2v-in-place','7 — Cleanup Targets','8 — KubeVirt VM'];
let playIndex = -1;
let playing = false;
let playTimer = null;

function getSpeed() { return parseInt(document.getElementById('speed-select').value, 10); }

function updateControls() {
  const playBtn = document.getElementById('btn-play');
  playBtn.innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
  playBtn.classList.toggle('active', playing);
  document.getElementById('btn-rewind').disabled = playIndex <= 0;
  document.getElementById('btn-forward').disabled = playIndex >= stepSequence.length - 1;
  const pct = playIndex < 0 ? 0 : ((playIndex + 1) / stepSequence.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('step-indicator').textContent = playIndex < 0 ? 'Step — / ' + stepSequence.length : stepLabels[playIndex];
}

function goToStep(idx) {
  playIndex = Math.max(-1, Math.min(idx, stepSequence.length - 1));
  selected = playIndex >= 0 ? stepSequence[playIndex] : null;
  draw();
  renderDetail();
  updateControls();
}

function playNext() {
  if (playIndex >= stepSequence.length - 1) { stopPlay(); return; }
  goToStep(playIndex + 1);
}

function startPlay() {
  const speed = getSpeed();
  if (speed === 0) {
    goToStep(playIndex >= stepSequence.length - 1 ? 0 : playIndex + 1);
    return;
  }
  playing = true;
  updateControls();
  if (playIndex >= stepSequence.length - 1) playIndex = -1;
  playNext();
  playTimer = setInterval(playNext, speed);
}

function stopPlay() {
  playing = false;
  clearInterval(playTimer);
  playTimer = null;
  updateControls();
}

function togglePlay() { playing ? stopPlay() : startPlay(); }

document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-forward').addEventListener('click', function() { stopPlay(); goToStep(playIndex + 1); });
document.getElementById('btn-rewind').addEventListener('click', function() { stopPlay(); goToStep(playIndex - 1); });
document.getElementById('speed-select').addEventListener('change', function() {
  if (playing) {
    clearInterval(playTimer);
    playTimer = null;
    const speed = getSpeed();
    if (speed === 0) { stopPlay(); return; }
    playTimer = setInterval(playNext, speed);
  }
});
document.getElementById('progress-track').addEventListener('click', function(e) {
  const rect = this.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const idx = Math.round(pct * (stepSequence.length - 1));
  stopPlay();
  goToStep(idx);
});
document.addEventListener('keydown', function(e) {
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight' || e.key === 'l') { stopPlay(); goToStep(playIndex + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'j') { stopPlay(); goToStep(playIndex - 1); }
});

function drawHighlightRing(x, y, radius) {
  ctx.save();
  ctx.strokeStyle = '#E74C3C';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 3]);
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawHighlightBox(x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = '#E74C3C';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 3]);
  ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);
  ctx.restore();
}

  drawPolyArrow([[663,138],[663,180],[490,180],[490,258]],{dash:[4,3],stroke:'#555',lineWidth:1.2});

  // ===== hyperv-populator Pod =====
  const s5Sel = selected==='step5';
  drawBox(410,274,230,114,{lineWidth:s5Sel?2.5:1.5,fill:s5Sel?'#e8f8e8':'#fff',stroke:s5Sel?'#27AE60':'#000'});
  drawStep(428,294,'5','#E74C3C');

  drawText(422,318,'1. Use host iSCSI initiator (iscsid)',{size:9});
  drawText(422,334,'2. Create per-session iSCSI interface',{size:9});
  drawText(422,350,'3. Register target in initiator database',{size:9});
  drawText(422,366,'4. iSCSI login \u2192 /dev/sdX appears',{size:9});
  drawText(422,382,'5. dd copy (direct I/O) \u2192 PVC',{size:9});
  addCircleHit(428,294,14,'step5');
  addHit(410,274,230,114,'step5');

  // Progress note
  const prSel = selected==='progress';
  drawText(422,393,'Prometheus progress metric on :8443',{size:8,italic:true,color:prSel?'#333':'#777'});
  addHit(410,386,230,12,'progress');

  // iSCSI data arrow
  const iscsiSel = selected==='iscsiarrow';
  drawArrow(314,340,410,326,{lineWidth:iscsiSel?4:3,stroke:'#E74C3C'});
  drawText(324,316,'iSCSI',{size:12,bold:true,color:'#E74C3C'});
  drawText(320,332,'TCP:3260',{size:9,color:'#E74C3C'});
  addHit(314,308,96,36,'iscsiarrow');

  // Destination PVCs
  const pvcSel = selected==='pvc';
  drawDisk(744,280,40,10,22,{fill:pvcSel?'#fbd9b0':'#FDEBD0',stroke:'#E67E22'});
  drawText(720,298,'destination',{size:9});
  drawText(730,312,'PVC-0',{size:9,bold:true});
  drawDisk(744,340,40,10,22,{fill:pvcSel?'#fbd9b0':'#FDEBD0',stroke:'#E67E22'});
  drawText(720,358,'destination',{size:9});
  drawText(730,372,'PVC-1',{size:9,bold:true});
  addHit(704,272,80,110,'pvc');

  // Arrows: pod -> PVCs
  drawArrow(640,308,704,296,{lineWidth:1.2});
  drawArrow(640,356,704,354,{lineWidth:1.2});
  drawText(648,288,'dd / direct I/O',{size:8});

  // Step 6: v2v-in-place
  const s6Sel = selected==='step6';
  drawBox(820,302,148,60,{lineWidth:s6Sel?2.5:1.5,fill:s6Sel?'#ece0f5':'#F5EEF8',stroke:'#8E44AD'});
  drawStep(836,328,'6','#8E44AD');
  drawText(852,330,'v2v-in-place',{size:12,bold:true});
  drawText(838,348,'(guest conversion:',{size:8,italic:true,color:'#555'});
  drawText(838,360,' drivers + bootloader)',{size:8,italic:true,color:'#555'});
  addCircleHit(836,328,14,'step6');
  addHit(820,302,148,60,'step6');

  drawArrow(820,322,787,302);
  drawArrow(820,340,787,354);

  // Step 8: KubeVirt VM
  const s8Sel = selected==='step8';
  drawBox(690,406,148,42,{lineWidth:s8Sel?2.5:1.5,fill:s8Sel?'#c5f0d5':'#D5F5E3',stroke:'#27AE60'});
  drawStep(706,428,'8','#27AE60');
  drawText(722,430,'KubeVirt VM',{size:12,bold:true,color:'#27AE60'});
  addCircleHit(706,428,14,'step8');
  addHit(690,406,148,42,'step8');

  drawArrow(744,372,762,406,{stroke:'#27AE60',lineWidth:1.2});

  // Performance notes
  drawText(410,476,'Copy: pure sequential block I/O (no VHDX parsing on Linux)',{size:9,italic:true,color:'#555'});
  drawText(410,492,'Conversion: v2v-in-place modifies PVC in place',{size:9,italic:true,color:'#555'});

  // ===== STEP SUMMARY =====
  drawBox(18,532,964,128,{fill:'#f8f8f8',stroke:'#ccc',lineWidth:1});
  drawText(32,552,'Step-by-step flow:',{size:12,bold:true});

  const summaryRows = [
    { y: 564, x: 32, num: '1', color: '#E74C3C', text: 'MTV powers off VM via WinRM, creates iSCSI targets + diff VHDXs + ACLs', id: 'step1' },
    { y: 588, x: 32, num: '2', color: '#2E86C1', text: 'Prerequisite: iSCSI Target role installed + firewall TCP 3260 open', id: 'step2' },
    { y: 612, x: 32, num: '3', color: '#F39C12', text: 'iSCSI Target Server exposes each VHDX as a LUN (IQN-based ACL)', id: 'step3' },
    { y: 636, x: 32, num: '4', color: '#555', text: 'MTV creates HyperVVolumePopulator CR + PVC + populator pod', id: 'step4' },
    { y: 564, x: 540, num: '5', color: '#E74C3C', text: 'Pod: iSCSI login \u2192 dd copy \u2192 PVC \u2192 logout', id: 'step5' },
    { y: 588, x: 540, num: '6', color: '#8E44AD', text: 'v2v-in-place: guest conversion (drivers + bootloader)', id: 'step6' },
    { y: 612, x: 540, num: '7', color: '#999', text: 'WinRM cleanup: remove targets + diff VHDXs', id: 'step7' },
    { y: 636, x: 540, num: '8', color: '#27AE60', text: 'Create KubeVirt VM \u2192 boot', id: 'step8' },
  ];
  for (const row of summaryRows) {
    const isActive = selected === row.id;
    if (isActive) {
      ctx.save();
      ctx.fillStyle = 'rgba(231, 76, 60, 0.10)';
      ctx.fillRect(row.x - 2, row.y - 2, 490, 22);
      ctx.restore();
    }
    drawStep(row.x + 10, row.y + 10, row.num, row.color);
    drawText(row.x + 28, row.y + 14, row.text, { size: 10, bold: isActive });
  }

  // Forklift phases
  drawBox(18,670,964,40,{fill:'#fff',stroke:'#ccc',lineWidth:1});
  drawText(32,688,'Forklift phases:',{size:10,bold:true});
  drawText(32,704,'PowerOff \u2192 SetupIscsiTargets \u2192 CreateDataVolumes \u2192 CopyDisks \u2192 CleanupIscsiTargets \u2192 ConvertGuest \u2192 CreateVM \u2192 Done',{size:9,color:'#333'});

  // Draw playback highlight ring around the active step
  if (selected && stepPositions[selected]) {
    const pos = stepPositions[selected];
    if (pos.type === 'circle') {
      drawHighlightRing(pos.x, pos.y, 22);
    } else {
      drawHighlightBox(pos.x, pos.y, pos.w, pos.h);
    }
  }
}

c.addEventListener('click', function(e) {
  stopPlay();
  const rect = c.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  let hit = null;
  for (let i = hitAreas.length - 1; i >= 0; i--) {
    const a = hitAreas[i];
    if (mx >= a.x && mx <= a.x + a.w && my >= a.y && my <= a.y + a.h) {
      hit = a.id; break;
    }
  }

  selected = selected === hit ? null : hit;
  playIndex = selected ? stepSequence.indexOf(selected) : -1;
  draw();
  renderDetail();
  updateControls();
});

function renderDetail() {
  const el = document.getElementById('detail');
  if (!selected || !details[selected]) {
    el.className = 'empty';
    el.innerHTML = 'Click any numbered step or component box to see details.';
    return;
  }
  el.className = '';
  const d = details[selected];
  let h = `<div class="d-title">${d.title}<span class="d-pill" style="background:${d.pillColor}">${d.pill}</span></div>`;
  h += `<div class="d-body">${d.body.replace(/\n/g,'<br>')}</div>`;
  if (d.files) {
    h += `<div class="d-row"><span class="d-label">Source files:</span><br>`;
    d.files.forEach(f => { h += `<span class="d-val"><code>${f}</code></span><br>`; });
    h += `</div>`;
  }
  if (d.notes) {
    h += `<div class="d-row"><span class="d-label">Notes:</span><br><span class="d-val">${d.notes}</span></div>`;
  }
  el.innerHTML = h;
}

draw();
updateControls();
</script>
